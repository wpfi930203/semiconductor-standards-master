<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 半导体标准专家 · 芯片 JESD（与 tools/make_icon.py 保持一致）-->
  <!-- 铜金引脚+壳体 = 封装与互连金属 | 靛蓝裸片 = die | 青色 JESD = JEDEC 标准编号前缀 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2038"/>
      <stop offset="1" stop-color="#1A3A5C"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#D98A1F"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- 20 根铜金引脚（4 边 × 5 根）-->
  <g fill="#E29A2C">
    <rect x="58.5" y="22" width="7" height="18"/>
    <rect x="82.5" y="22" width="7" height="18"/>
    <rect x="106.5" y="22" width="7" height="18"/>
    <rect x="130.5" y="22" width="7" height="18"/>
    <rect x="58.5" y="160" width="7" height="18"/>
    <rect x="82.5" y="160" width="7" height="18"/>
    <rect x="106.5" y="160" width="7" height="18"/>
    <rect x="130.5" y="160" width="7" height="18"/>
    <rect x="22" y="58.5" width="18" height="7"/>
    <rect x="22" y="82.5" width="18" height="7"/>
    <rect x="22" y="106.5" width="18" height="7"/>
    <rect x="22" y="130.5" width="18" height="7"/>
    <rect x="160" y="58.5" width="18" height="7"/>
    <rect x="160" y="82.5" width="18" height="7"/>
    <rect x="160" y="106.5" width="18" height="7"/>
    <rect x="160" y="130.5" width="18" height="7"/>
  </g>

  <!-- 铜金壳体（封装）-->
  <rect x="40" y="40" width="120" height="120" rx="14" fill="url(#shell)" stroke="#965C0C" stroke-width="2"/>

  <!-- pin-1 定位点 -->
  <circle cx="55" cy="55" r="4.5" fill="#784E10"/>

  <!-- 靛蓝裸片die -->
  <rect x="58" y="58" width="84" height="84" rx="8" fill="#0C1C30" stroke="#3A6E96" stroke-width="2"/>

  <!-- JESD = JEDEC 标准编号前缀，本 skill 的独占语义 -->
  <text x="100" y="96" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#6FE3D6" text-anchor="middle" dominant-baseline="central">JESD</text>
  <rect x="76" y="116" width="48" height="4" fill="#6FE3D6"/>
</svg>
